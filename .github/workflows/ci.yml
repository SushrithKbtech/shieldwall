name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest scikit-learn==1.7.2 "numpy>=2" joblib
      - run: pytest -q
      - run: SHIELDWALL_ML=off pytest -q   # the base tool must work with no ML model too
  bpf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev
      - run: make -C bpf xdp_filter.o
